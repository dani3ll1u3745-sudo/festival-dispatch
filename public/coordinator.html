<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coordinator | MaydAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="banner" id="banner"></div>

<div class="overlay" id="start">
  <div class="panel" style="max-width: 420px; width: 100%;">
    <h1>Coordinator</h1>
    <p class="muted">Alerts play a sound, so tap to start your shift.</p>
    <button class="full" id="startBtn" style="margin-top: 1rem;">Start shift</button>
  </div>
</div>

<div class="overlay" id="snapshotModal" role="dialog" aria-modal="true" aria-label="Camera frame" hidden>
  <div class="panel" style="max-width: 900px; width: 100%;">
    <img id="snapshotImg" alt="Camera frame at detection" style="width: 100%; border-radius: 8px; display: block;">
    <button class="secondary full" id="snapshotClose" style="margin-top: .75rem;">Close</button>
  </div>
</div>

<div class="page">
  <div class="topbar">
    <div>
      <h1>MaydAI</h1>
      <p class="muted small" id="festival"></p>
    </div>
    <span class="small"><span id="dot" class="status-dot"></span><span id="conn">Connecting</span></span>
  </div>

  <section id="incidents">
    <div class="panel muted" id="empty">No incidents. New alerts from cameras and volunteers appear here.</div>
  </section>

  <div class="panel">
    <h2>Volunteers</h2>
    <div id="roster" class="small muted">Loading…</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script>
  const socket = io();
  const { esc, timeAgo } = FD;
  let incidents = new Map();
  let volunteers = [];
  let config = null;

  startBtn.onclick = () => { FD.unlockAudio(); start.hidden = true; };

  socket.on('connect', () => { dot.classList.add('on'); conn.textContent = 'Connected'; });
  socket.on('disconnect', () => { dot.classList.remove('on'); conn.textContent = 'Reconnecting'; });

  socket.on('state', s => {
    config = s.config;
    festival.textContent = config.festivalName;
    incidents = new Map(s.incidents.map(i => [i.id, i]));
    volunteers = s.volunteers;
    render();
  });
  socket.on('incident:new', i => {
    incidents.set(i.id, i);
    FD.beep(3);
    showBanner(`${i.typeLabel} at ${i.zoneName}`, i.type);
    render();
  });
  socket.on('incident:updated', i => { incidents.set(i.id, i); render(); });
  socket.on('volunteers:updated', v => { volunteers = v; render(); });

  function showBanner(text, type) {
    banner.textContent = text;
    banner.style.background = `var(--${type === 'overcrowding' ? 'crowd' : type}-strong)`; // darker shade keeps white text AA
    banner.classList.add('show');
    clearTimeout(showBanner.t);
    showBanner.t = setTimeout(() => banner.classList.remove('show'), 4000);
  }

  const qualNames = qs => qs.map(q => config.qualifications[q] || q).join(', ') || 'No qualifications';
  const assignmentLabel = { sent: 'Notified', accepted: 'On the way', arrived: 'Arrived' };
  const fmtDuration = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const PHONE_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
  // Incident ids the coordinator has opened, kept across re-renders so live updates don't collapse them.
  const expandedResolved = new Set();
  const expandedCandidates = new Set();

  function incidentCard(i) {
    const open = i.status !== 'resolved';
    const header = `
      <span><span class="tag ${i.type}">${esc(i.typeLabel)}</span> ${esc(i.zoneName)}</span>
      <span class="small muted">${open ? '' : 'Resolved '}${timeAgo(i.createdAt)}</span>`;

    // Resolved incidents collapse to a single line that toggles the full card.
    if (!open && !expandedResolved.has(i.id)) {
      return `
      <article class="panel incident ${i.type} resolved collapsed">
        <button class="card-toggle" data-toggle-resolved="${i.id}" aria-expanded="false">${header}</button>
      </article>`;
    }

    const rec = i.recommendation;
    const reasons = new Map((rec?.volunteers || []).map(v => [v.id, v.reason]));
    // Order shortlist by the AI's ranking when available.
    const order = rec?.volunteers?.map(v => v.id) || [];
    const shortlist = [...i.shortlist].sort((a, b) => {
      const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    const sources = i.sources.map(s => (s === 'camera' ? 'Camera' : 'Volunteer report')).join(' + ');
    const conf = i.confidence != null && i.sources.includes('camera') ? `, ${(i.confidence * 100).toFixed(0)}% confidence` : '';

    const assigned = i.assignments || [];
    const assignedSection = i.status === 'resolved' ? '<p><strong>Resolved</strong></p>' : `
      <h3 style="margin-top:.8rem">Assigned (${assigned.length}${rec ? ` of ${rec.recommendedCount} recommended` : ''})</h3>
      ${assigned.length ? assigned.map(a => `
      <div class="candidate">
        <div>
          <h3>${esc(a.name)}</h3>
          <p class="small muted">${assignmentLabel[a.status] || esc(a.status)}</p>
        </div>
        <button class="secondary" data-unassign="${i.id}" data-vol="${a.volunteerId}"
          data-confirm="${esc(`Stand ${a.name} down from this incident?`)}">Remove</button>
      </div>`).join('') : '<p class="small muted">Waiting for dispatch</p>'}`;

    const candidateRows = shortlist.length ? shortlist.map(v => `
      <div class="candidate">
        <div>
          <h3>${esc(v.name)} ${v.online ? '<span class="status-dot on" title="Phone connected"></span>' : ''}</h3>
          <p class="small muted">${esc(reasons.get(v.id) || `${qualNames(v.qualifications)}; ${v.distance} m away`)}</p>
          ${v.qualified ? '' : '<p class="small warn">No matching qualification</p>'}
        </div>
        <button data-dispatch="${i.id}" data-vol="${v.id}">${assigned.length ? 'Add' : 'Dispatch'}</button>
      </div>`).join('') : '<p class="small muted">No available volunteers.</p>';
    const candidateList = `<h3 style="margin-top:.8rem">Available volunteers</h3>${candidateRows}`;
    // Once enough people are assigned, tuck the candidate list behind a toggle.
    const enoughAssigned = rec && assigned.length >= rec.recommendedCount;
    const showCandidates = !enoughAssigned || expandedCandidates.has(i.id);
    const candidates = !open ? '' : enoughAssigned ? `
      <button class="secondary full" style="margin-top:.8rem" data-toggle-candidates="${i.id}" aria-expanded="${showCandidates}">
        Add more people (${shortlist.length})
      </button>
      ${showCandidates ? candidateList : ''}` : candidateList;

    const num = esc(config.emergencyNumber);
    const callLink = (cls, icon = '') => `<a class="button ${cls}" href="tel:${num}" data-call>${icon}Call ${num}</a>`;
    // The server keeps needsEscalation current for every unresolved incident, counting who is already assigned.
    const escalating = open && i.needsEscalation;
    const escalation = escalating ? `
      <div class="escalation">
        <h3>No trained volunteer available</h3>
        ${callLink('danger full')}
      </div>` : '';
    const fireCall = open && i.type === 'fire' && !escalating ? callLink('call-outline', PHONE_ICON) : '';
    const busy = escalating && i.busyCandidates?.length ? `
      <h3 style="margin-top:.8rem">Busy volunteers you could reassign</h3>
      ${i.busyCandidates.map(v => `
      <div class="candidate">
        <div>
          <h3>${esc(v.name)} ${v.online ? '<span class="status-dot on" title="Phone connected"></span>' : ''}</h3>
          <p class="small muted">${esc(`${qualNames(v.qualifications)}; ${v.distance} m away`)}</p>
          <p class="small">Currently on ${esc(v.currentTypeLabel)} at ${esc(v.currentZoneName)}</p>
          ${v.qualified ? '' : '<p class="small warn">No matching qualification</p>'}
        </div>
        <button data-dispatch="${i.id}" data-vol="${v.id}"
          data-confirm="${esc(`Take ${v.name} off ${v.currentTypeLabel} at ${v.currentZoneName}?`)}">Reassign</button>
      </div>`).join('')}` : '';

    const thumb = i.snapshot ? `
      <button class="thumb" data-snapshot="${i.id}" aria-label="Enlarge camera frame">
        <img src="${i.snapshot}" alt="Camera frame at detection">
      </button>` : '';

    const clips = i.audioClips?.length ? `
      <h3 style="margin-top:.6rem">Voice clips</h3>
      ${i.audioClips.map(c => `
      <div class="voice-clip">
        <div class="row">
          <span class="small"><strong>${esc(c.volunteerName)}</strong>
            <span class="muted">${new Date(c.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}, ${fmtDuration(c.durationSec)}</span></span>
          <a class="button secondary" href="/api/audio/${esc(c.id)}?download=1">Download</a>
        </div>
        <audio controls preload="none" src="/api/audio/${esc(c.id)}" data-clip="${esc(c.id)}"></audio>
      </div>`).join('')}` : '';

    return `
      <article class="panel incident ${i.type} ${i.status}">
        ${open
          ? `<h2 class="card-head">${header}</h2>`
          : `<button class="card-toggle" data-toggle-resolved="${i.id}" aria-expanded="true">${header}</button>`}
        <p class="small muted">${sources}${conf}${i.reportCount > 1 ? `, ${i.reportCount} reports` : ''}</p>
        ${i.note ? `<p class="description">“${esc(i.note)}”</p>` : ''}
        ${i.reclassifiedFrom ? `<p class="small muted">AI reclassified from ${esc(i.reclassifiedFrom)}: ${esc(i.classificationReason || '')}</p>`
          : i.type === 'other' && i.classificationReason ? `<p class="small muted">AI assessment: ${esc(i.classificationReason)}</p>` : ''}
        ${clips}
        <div class="summary-row">
          ${thumb}
          ${rec ? `<p>${esc(rec.summary)}</p>` : '<p class="small muted">Getting recommendation…</p>'}
        </div>
        ${rec ? `
          <ul class="small">${rec.actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul>
          <p class="small muted">${rec.source === 'ai' ? 'AI recommendation' : 'Standard procedure (AI unavailable)'}</p>
        ` : ''}
        ${assignedSection}
        ${escalation}
        ${candidates}
        ${busy}
        ${open ? `
          <div class="${fireCall ? 'card-actions' : ''}" style="margin-top:.6rem">
            ${fireCall}
            <button class="secondary full" data-resolve="${i.id}">Mark resolved</button>
          </div>` : ''}
      </article>`;
  }

  function render() {
    if (!config) return;
    const list = [...incidents.values()].sort((a, b) =>
      (a.status === 'resolved') - (b.status === 'resolved') || b.createdAt - a.createdAt);
    empty.hidden = list.length > 0;
    // Keep existing audio players (and anything playing) across re-renders: live updates arrive often.
    const players = new Map([...document.querySelectorAll('#incidents audio[data-clip]')].map(a => [a.dataset.clip, a]));
    document.querySelectorAll('#incidents article').forEach(n => n.remove());
    incidentsEl.insertAdjacentHTML('beforeend', list.map(incidentCard).join(''));
    document.querySelectorAll('#incidents audio[data-clip]').forEach(a => {
      const old = players.get(a.dataset.clip);
      if (old) a.replaceWith(old);
    });

    roster.innerHTML = volunteers.map(v => `
      <div class="candidate">
        <div><h3>${v.online ? '<span class="status-dot on"></span>' : '<span class="status-dot"></span>'}${esc(v.name)}</h3>
        <p class="muted">${qualNames(v.qualifications)}, at ${esc(config.zones[v.zoneId]?.name)}</p></div>
        <span class="tag quiet">${v.status}</span>
      </div>`).join('') || 'No volunteers yet.';
  }
  const incidentsEl = document.getElementById('incidents');

  document.addEventListener('click', e => {
    const call = e.target.closest('[data-call]');
    if (call && !confirm(`Call ${config.emergencyNumber}? This dials emergency services.`)) e.preventDefault();
    const d = e.target.closest('[data-dispatch]');
    if (d && (!d.dataset.confirm || confirm(d.dataset.confirm))) {
      d.disabled = true;
      socket.emit('dispatch', { incidentId: d.dataset.dispatch, volunteerId: d.dataset.vol }, res => {
        if (res?.error) { alert(res.error); d.disabled = false; }
        else if (!res.delivered) showBanner('Assigned, but that volunteer has no phone connected', 'medical');
      });
    }
    const u = e.target.closest('[data-unassign]');
    if (u && confirm(u.dataset.confirm)) {
      u.disabled = true;
      socket.emit('incident:unassign', { incidentId: u.dataset.unassign, volunteerId: u.dataset.vol });
    }
    const r = e.target.closest('[data-resolve]');
    if (r) socket.emit('incident:resolve', { incidentId: r.dataset.resolve });

    const tr = e.target.closest('[data-toggle-resolved]');
    if (tr) toggleAndKeepFocus(expandedResolved, tr.dataset.toggleResolved, 'data-toggle-resolved');
    const tc = e.target.closest('[data-toggle-candidates]');
    if (tc) toggleAndKeepFocus(expandedCandidates, tc.dataset.toggleCandidates, 'data-toggle-candidates');

    const s = e.target.closest('[data-snapshot]');
    if (s) openSnapshot(s.dataset.snapshot);
  });

  // render() rebuilds the cards, so put keyboard focus back on the toggle that was used.
  function toggleAndKeepFocus(set, id, attr) {
    set.has(id) ? set.delete(id) : set.add(id);
    render();
    document.querySelector(`[${attr}="${id}"]`)?.focus();
  }

  // ---- Snapshot modal ----
  let snapshotFrom = null;
  function openSnapshot(id) {
    snapshotImg.src = incidents.get(id)?.snapshot || '';
    snapshotFrom = id;
    snapshotModal.hidden = false;
    snapshotClose.focus();
  }
  function closeSnapshot() {
    snapshotModal.hidden = true;
    snapshotImg.removeAttribute('src');
    document.querySelector(`[data-snapshot="${snapshotFrom}"]`)?.focus();
  }
  snapshotClose.onclick = closeSnapshot;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !snapshotModal.hidden) closeSnapshot(); });

  setInterval(render, 15000); // keep "x min ago" fresh
</script>
</body>
</html>
